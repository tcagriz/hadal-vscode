name: Check package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package extension
        run: npx --yes @vscode/vsce@4.1.1 package --out /tmp/hadal-theme.vsix
